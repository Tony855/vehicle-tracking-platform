listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
}

allow_anonymous = false

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://backend:8080/internal/mqtt/auth"
    headers {
      "content-type" = "application/json"
      "X-MQTT-Auth-Secret" = "${EMQX_AUTH_SHARED_SECRET}"
    }
    body {
      username = "${username}"
      password = "${password}"
    }
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://backend:8080/internal/mqtt/acl"
      headers {
        "content-type" = "application/json"
        "X-MQTT-Auth-Secret" = "${EMQX_AUTH_SHARED_SECRET}"
      }
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}

dashboard {
  listeners.http {
    enable = false
  }
}
