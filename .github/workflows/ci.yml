name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Validate compose syntax
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Boot stack and verify database migrations
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              echo "Backend is healthy; Flyway migrations completed during startup."
              exit 0
            fi
            sleep 5
          done
          docker compose logs --no-color
          exit 1
          for attempt in $(seq 1 18); do
            if docker compose exec -T emqx emqx ctl status; then
              echo "EMQX broker is running."
              exit 0
            fi
            sleep 5
          done
          docker compose logs --no-color emqx
          exit 1
      - name: Stop stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down -v
          else
            echo "Compose environment was not created; nothing to stop."
          fi
